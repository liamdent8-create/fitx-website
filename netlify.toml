[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Temporary: send the home page to the studio sales page until Home is built.
[[redirects]]
  from = "/"
  to = "/studio"
  status = 302

# The old mums and bubs page is now the mums and bubs class page.
[[redirects]]
  from = "/mums-and-bubs"
  to = "/classes/mums-and-bubs"
  status = 301
